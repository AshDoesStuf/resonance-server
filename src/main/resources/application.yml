spring:
  application:
    name: resonance-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/resonance}
    username: ${SPRING_DATASOURCE_USERNAME:resonance}
    password: ${SPRING_DATASOURCE_PASSWORD:resonance}
  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by Flyway, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8443}
  tomcat:
    max-swallow-size: 16MB

resonance:
  storage:
    root: ${DATA_ROOT:./data}
  jwt:
    # Base64-encoded 256-bit secret. Override in production via env var — this default
    # is dev-only and intentionally not secret.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZC1jaGFuZ2UtbWU=}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  seed:
    # If set, a CommandLineRunner creates this user on startup if it doesn't already exist.
    # Meant for the initial single-user setup — leave unset after first run.
    username: ${SEED_USERNAME:}
    password: ${SEED_PASSWORD:}

logging:
  level:
    com.ash.resonance: INFO
