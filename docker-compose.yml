services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: resonance
      POSTGRES_USER: resonance
      POSTGRES_PASSWORD: resonance   # dev only — override for anything beyond localhost
    ports:
      - "5433:5432"   # host 5433 -> container 5432, to avoid colliding with other local Postgres instances
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resonance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

# The `app` and `caddy` services from the full design (§14) get added once
# Phase 2+ needs streaming/uploads and there's something worth reverse-proxying.
# For Phase 1, run the Spring Boot app locally with `mvn spring-boot:run`
# against this Postgres container.